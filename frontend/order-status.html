<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order Status — CutoutCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23d9572b%27/%3E%3Cg fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%273%27/%3E%3Ccircle cx=%2711%27 cy=%2721%27 r=%273%27/%3E%3Cpath d=%27M13.2 13.2 24 24M24 8 13.2 18.8%27/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script src="js/icons.js"></script>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark"><svg class="icon"><use href="#i-scissors"/></svg></span>
        CutoutCraft
      </a>
      <nav class="site-nav" data-nav aria-label="Main">
        <a href="index.html#studio">Studio</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="index.html#gallery">Gallery</a>
      </nav>
      <div class="header-actions">
        <a class="cart-pill" href="checkout.html">
          <svg class="icon"><use href="#i-bag"/></svg>
          <span class="cart-pill__label">Cart</span>
          <span class="cart-pill__count" data-cart-count aria-label="items in cart">0</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="Menu">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container page">
    <h1>Check your order status</h1>
    <p class="lead">Enter your order ID and the email you used at checkout.</p>

    <div id="status" class="status-message error"></div>

    <form id="lookup-form" class="card" novalidate>
      <div class="form-row cols-2">
        <div class="field">
          <label for="order-id">Order ID</label>
          <input id="order-id" type="text" required />
        </div>
        <div class="field">
          <label for="lookup-email">Email</label>
          <input id="lookup-email" type="email" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:1.25rem">
        Check status
      </button>
    </form>

    <div id="result" class="card" style="margin-top:1.5rem; display:none">
      <h2 style="margin-top:0">Order <span id="result-id"></span></h2>
      <p>
        Status: <span id="result-status" class="order-status-pill"></span>
      </p>
      <div id="result-items"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark"><svg class="icon"><use href="#i-scissors"/></svg></span>
        CutoutCraft
      </a>
      <nav aria-label="Footer">
        <a href="index.html#studio">Studio</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="policies.html">Returns policy</a>
      </nav>
      <span>&copy; <span data-year id="year"></span> CutoutCraft. Made with cardboard &amp; love.</span>
    </div>
  </footer>

  <script src="js/site-config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/order-status.js"></script>
</body>
</html>
